name: Pipeline CI-CD Practica


on:
  push:
    branches: [ "main", "master" ]


permissions:
  contents: read
  packages: write

jobs:
  job_pipeline:
    
    runs-on: ubuntu-latest

    steps:
    
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v4

    
    - name: Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    
    - name: Instalar dependencias del proyecto
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt

    
    - name: Validar formato del codigo con Ruff
      working-directory: app
      run: ruff check .

    
    - name: Ejecutar pruebas unitarias con Pytest
      working-directory: app
      run: pytest

    
    - name: Autenticarse en GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

  
    - name: Construir y desplegar imagen Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
            ghcr.io/edgar10101993/repositorioedgar:latest
